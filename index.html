<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>🌿 NatureQuest</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <h1>🌿 NatureQuest</h1>

    <a href="admin.html">
        🔐 Administration
    </a>

</header>


<main>

    <!-- PROFIL -->

    <section class="card">

        <h2>👤 Mon profil</h2>

        <input
            id="username"
            placeholder="Ton pseudo">

        <button onclick="saveProfile()">
            💾 Enregistrer
        </button>

        <div class="stats">

            <div>
                🏆
                <b id="score">0</b>
                points
            </div>

            <div>
                ✅
                <b id="completed">0</b>
                quêtes
            </div>

        </div>

    </section>


    <!-- CARTE -->

    <section class="card">

        <h2>🗺️ Carte des quêtes</h2>

        <div id="map"></div>

        <button onclick="locatePlayer()">
            📍 Ma position
        </button>

    </section>


    <!-- SCANNER -->

    <section class="card">

        <h2>📷 Scanner un QR code</h2>

        <div id="reader"></div>

        <button onclick="startScanner()">
            📷 Scanner
        </button>

        <button
            class="danger"
            onclick="stopScanner()">

            Fermer

        </button>

    </section>


    <!-- QUÊTE -->

    <section
        id="questSection"
        class="card hidden">

        <h2 id="questName"></h2>

        <p id="questDescription"></p>

        <hr>

        <h3 id="questQuestion"></h3>

        <div id="answers"></div>

        <button onclick="validateQuest()">

            ✅ Valider

        </button>

        <p id="questResult"></p>

    </section>


    <!-- LISTE -->

    <section class="card">

        <h2>🌳 Quêtes disponibles</h2>

        <div id="questList"></div>

    </section>

</main>


<footer>

    NatureQuest 🌿

</footer>
