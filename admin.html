<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>🔐 NatureQuest Admin</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <h1>
        🔐 NatureQuest Admin
    </h1>

    <a href="index.html">
        🎮 Retour au jeu
    </a>

</header>


<main>

<section class="card">

    <h2>
        ➕ Créer une quête
    </h2>


    <input
        id="id"
        placeholder="ID : parc004">


    <input
        id="qr"
        placeholder="QR : NATURE-004">


    <input
        id="name"
        placeholder="Nom de la quête">


    <textarea
        id="description"
        placeholder="Description">
    </textarea>


    <textarea
        id="question"
        placeholder="Question">
    </textarea>


    <select id="type">

        <option value="creative">
            Réponse libre
        </option>

        <option value="text">
            Réponse exacte
        </option>

        <option value="choice">
            Choix multiple
        </option>

    </select>


    <input
        id="answer"
        placeholder="Réponse correcte">


    <textarea
        id="options"
        placeholder="Choix multiples : un choix par ligne">
    </textarea>


    <input
        id="points"
        type="number"
        value="10"
        placeholder="Points">


    <input
        id="latitude"
        placeholder="Latitude">


    <input
        id="longitude"
        placeholder="Longitude">


    <input
        id="next"
        placeholder="ID de la prochaine quête">


    <label>

        <input
            id="active"
            type="checkbox"
            checked>

        Quête active

    </label>


    <br>


    <button onclick="generateQuest()">

        🧩 Générer le code

    </button>

</section>


<section class="card">

    <h2>
        📋 Code à copier
    </h2>


    <textarea
        id="output"
        readonly>
    </textarea>


    <button onclick="copyCode()">

        📋 Copier

    </button>

</section>


<section class="card">

    <h2>
        🔲 Générer un QR code
    </h2>


    <input
        id="qrGenerator"
        placeholder="NATURE-004">


    <button onclick="generateQR()">

        Générer QR

    </button>


    <div id="qrResult"></div>

</section>

</main>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<script src="admin.js"></script>

</body>
