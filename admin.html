<!doctype html>
<html lang="fr">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>NatureQuest Admin</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h1>🔐 NatureQuest Admin</h1>

    <a href="index.html">
        🎮 Joueur
    </a>

</header>

<main>

<section id="loginAdmin"
         class="card">

    <h2>Connexion administrateur</h2>

    <input id="ae"
           type="email"
           placeholder="E-mail">

    <input id="ap"
           type="password"
           placeholder="Mot de passe">

    <button id="adminLogin">
        Connexion
    </button>

    <p id="am"></p>

</section>


<div id="admin"
     class="hidden">


<!-- CREATION QUETE -->

<section class="card">

    <h2>➕ Créer une quête</h2>

    <div class="cols">

        <div>

            <input id="name"
                   placeholder="Nom de la quête">

            <textarea id="desc"
                      placeholder="Description"></textarea>

            <select id="type">

                <option value="creative">
                    💡 Réponse libre
                </option>

                <option value="text">
                    ✍️ Réponse exacte
                </option>

                <option value="choice">
                    🔘 Choix multiple
                </option>

            </select>

            <textarea id="question"
                      placeholder="Question"></textarea>

            <textarea id="options"
                      placeholder="Choix, un par ligne"></textarea>

            <input id="correct"
                   placeholder="Réponse correcte">

            <input id="points"
                   type="number"
                   value="10">

            <input id="qr"
                   placeholder="QR-PARC-001">

        </div>


        <div>

            <p>
                Clique sur la carte pour placer
                le point GPS.
            </p>

            <button id="gps">
                📍 Utiliser ma position
            </button>

            <div id="adminMap"></div>

            <input id="lat"
                   placeholder="Latitude">

            <input id="lng"
                   placeholder="Longitude">

        </div>

    </div>

    <button id="create">
        💾 Publier la quête
    </button>

    <p id="cm"></p>

</section>


<!-- QR -->

<section class="card">

    <h2>🔲 Générer un QR code</h2>

    <input id="qrValue"
           placeholder="QR-PARC-001">

    <button id="genQr">
        Générer
    </button>

    <div id="qrOut"></div>

</section>


<!-- LISTE -->

<section class="card">

    <h2>📋 Quêtes</h2>

    <div id="list"></div>

</section>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>

</body>
</html>
